name: Verify and finalize Tauri migration

on:
  push:
    branches: [feat/tauri-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lsof \
            wget

      - name: Normalize migration sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package.setdefault("devDependencies", {})["@types/node"] = "^24.0.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          vite_path = Path("vite.config.ts")
          vite = vite_path.read_text()
          if 'publicDir: "assets"' not in vite:
              vite = vite.replace(
                  "export default defineConfig({",
                  'export default defineConfig({\n  publicDir: "assets",',
                  1,
              )
          vite_path.write_text(vite)

          main_path = Path("src/main.ts")
          main = main_path.read_text()
          if "const HTML_ESCAPES:" not in main:
              main = re.sub(
                  r'^function h\(value: unknown\): string \{.*$',
                  'const HTML_ESCAPES: Record<string, string> = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\\\'": "&#39;", \'"\': "&quot;" };\n'
                  'function h(value: unknown): string { return String(value ?? "").replace(/[&<>\\\'\"]/g, (character) => HTML_ESCAPES[character] ?? character); }',
                  main,
                  count=1,
                  flags=re.MULTILINE,
              )
          main_path.write_text(main)

          scanner_path = Path("src-tauri/src/scanner.rs")
          scanner = scanner_path.read_text()
          scanner = scanner.replace(
              '        let Some((field, value)) = line.split_at_checked(1) else { continue };',
              '        if line.is_empty() {\n            continue;\n        }\n        let (field, value) = line.split_at(1);',
          )
          scanner = scanner.replace(
              '.map(Pid::as_u32)',
              '.map(|pid| pid.as_u32())',
          )
          scanner = scanner.replace(
              '"pom.xml" => xml_tag(&fs::read_to_string(root.join(source)).ok()?, "artifactId").map(clean_project_name),',
              '"pom.xml" => xml_tag(&fs::read_to_string(root.join(source)).ok()?, "artifactId")\n            .map(|value| clean_project_name(&value)),',
          )
          scanner = scanner.replace(
              '        matches!(\n            port,',
              '        matches!(\n            *port,',
          )
          scanner_path.write_text(scanner)

          lib_path = Path("src-tauri/src/lib.rs")
          lib = lib_path.read_text()
          lib = re.sub(
              r'let config_dir = app\s*\.path\(\)\s*\.app_config_dir\(\)\s*\.map_err\(\|error\| format!\("Could not resolve the app configuration directory: \{error\}"\)\)\?;',
              'let config_dir = app.path().app_config_dir()?;',
              lib,
              count=1,
          )
          lib_path.write_text(lib)

          config_path = Path("src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["bundle"]["icon"] = [
              "icons/32x32.png",
              "icons/128x128.png",
              "icons/128x128@2x.png",
              "icons/icon.png",
          ]
          config_path.write_text(json.dumps(config, indent=2) + "\n")

          ci_path = Path(".github/workflows/ci.yml")
          if ci_path.exists():
              ci = ci_path.read_text().replace("os: macos-15", "os: macos-latest")
              ci_path.write_text(ci)
          PY

          mkdir -p src-tauri/icons
          cp assets/cutting-board-32.png src-tauri/icons/32x32.png
          cp assets/cutting-board-128.png src-tauri/icons/128x128.png
          cp assets/cutting-board-256.png src-tauri/icons/128x128@2x.png
          cp assets/cutting-board-512.png src-tauri/icons/icon.png

          git rm -r --ignore-unmatch \
            packaging \
            scripts \
            tests \
            src/cutting_board \
            .migration
          git rm --ignore-unmatch \
            pyproject.toml \
            requirements.txt \
            requirements-dev.txt \
            .github/workflows/ubuntu-24.04.yml \
            .github/workflows/finalize-tauri-migration.yml

      - name: Install frontend dependencies
        run: npm install

      - name: Apply compiler suggestions and format
        shell: bash
        run: |
          set -euo pipefail
          cargo fix --manifest-path src-tauri/Cargo.toml --all-targets --allow-dirty --allow-staged || true
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Type-check frontend
        run: npm run check

      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build Tauri desktop bundle
        run: npm run tauri build

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          cat > MIGRATION_VALIDATED.md <<'EOF'
          # Tauri migration validation

          The migration branch was validated in a clean Ubuntu 24.04 GitHub Actions environment with:

          - strict TypeScript type checking;
          - Rust formatting;
          - all Rust test targets;
          - a complete Tauri desktop bundle build.

          The regular pull request workflow repeats the same checks on Ubuntu and macOS.
          EOF

          git rm --ignore-unmatch .github/workflows/verify-tauri-migration.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            package.json \
            package-lock.json \
            vite.config.ts \
            src/main.ts \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/tauri.conf.json \
            src-tauri/src \
            src-tauri/icons \
            .github/workflows/ci.yml \
            MIGRATION_VALIDATED.md

          if ! git diff --cached --quiet; then
            git commit -m "test: validate the complete Tauri migration"
            git push origin HEAD:feat/tauri-migration
          fi
