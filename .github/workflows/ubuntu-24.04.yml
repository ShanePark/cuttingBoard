name: Ubuntu 24.04 verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu runtime and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-psutil xvfb dpkg-dev
      - name: Verify source, GUI and package
        run: ./scripts/verify.sh
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: cutting-board-ubuntu-24.04
          path: dist/cutting-board_*_all.deb
          if-no-files-found: error
