[package]
name = "cutting-board"
version = "0.6.0"
description = "A local development service board"
authors = ["Shane Park"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "cutting_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cutting-board"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
sha1 = "0.10"
dirs = "6"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
